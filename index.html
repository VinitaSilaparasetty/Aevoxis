<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aevoxis Solutions</title>
    <!--app-head-->
    <meta name="author" content="Vinita Silaparasetty" />
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="alternate" type="application/rss+xml" title="Aevoxis Insights" href="/rss.xml">
    <link rel="stylesheet" id="silktide-consent-manager-css" href="/silktide-consent-manager.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/silktide-consent-manager.js"></script>
    <script>
      silktideCookieBannerManager.updateCookieBannerConfig({
        background: {
          showBackground: true
        },
        cookieIcon: {
          position: "bottomLeft"
        },
        cookieTypes: [
          {
            id: "essenziell_technisch_notwendig",
            name: "Essential",
            description: "<p><span style=\"font-size:13pt;font-family:Arial,sans-serif;color:#39434c;font-weight:700;\">These cookies are technically required for this website to work securely (§ 25(2) TDDDG). They store your privacy choices and make sure form submissions reach us. They don't need consent and can't be switched off.</span></p>",
            required: true,
            onAccept: function() {
              console.log('Essenziell / Technisch Notwendig accepted');
            }
          },
          {
            id: "analyse_performance",
            name: "Analytics",
            description: "<p><span style=\"font-size:13pt;font-family:Arial,sans-serif;font-weight:700;\">These cookies let us count visits and traffic sources so we can see how the site is used (Art. 6(1)(a) GDPR and § 25 TDDDG). Consent is optional, and you can withdraw it at any time using the cookie icon in the bottom left.</span></p>",
            required: false,
            onAccept: function() {
              if (typeof gtag !== 'undefined') {
                gtag('consent', 'update', { analytics_storage: 'granted' });
              }
              if (typeof dataLayer !== 'undefined') {
                dataLayer.push({ 'event': 'consent_accepted_analyse_performance' });
              }
            },
            onReject: function() {
              if (typeof gtag !== 'undefined') {
                gtag('consent', 'update', { analytics_storage: 'denied' });
              }
            }
          }
        ],
        text: {
          banner: {
            description: "<p><span style=\"font-size:13pt;font-family:Arial,sans-serif;font-weight:700;\">Privacy &amp; AI transparency: we use essential cookies and, with your consent, analytics. Some content on this site was written with AI assistance. Your data is not used to train AI models. Details: <a href=\"/datenschutz\" style=\"color:#39434c;text-decoration:underline;\">Datenschutzerklärung (privacy policy)</a></span></p>",
            acceptAllButtonText: "Accept all",
            acceptAllButtonAccessibleLabel: "Accept all cookies",
            rejectNonEssentialButtonText: "Reject non-essential",
            rejectNonEssentialButtonAccessibleLabel: "Reject non-essential cookies",
            preferencesButtonText: "Preferences",
            preferencesButtonAccessibleLabel: "Open cookie preferences"
          },
          preferences: {
            title: "Privacy preferences",
            description: "<p><span style=\"font-size:13pt;font-family:Arial,sans-serif;font-weight:700;\">You decide how your data is used. Switch individual cookie categories on or off below.</span></p>",
            creditLinkText: "Privacy preferences",
            creditLinkAccessibleLabel: "Privacy preferences"
          }
        },
        position: {
          banner: "center"
        }
      });
    </script>
    <script>var d=document,w="https://tally.so/widgets/embed.js",v=function(){"undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach((function(e){e.src=e.dataset.tallySrc}))};if("undefined"!=typeof Tally)v();else if(d.querySelector('script[src="'+w+'"]')==null){var s=d.createElement("script");s.src=w,s.onload=v,s.onerror=v,d.body.appendChild(s);}</script>
  </body>
</html>
